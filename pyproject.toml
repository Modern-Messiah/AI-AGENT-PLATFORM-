[project]
name = "ai-agent-platform"
version = "0.1.0"
description = "Durable AI agents on PydanticAI + Temporal with Bifrost gateway and Langfuse observability"
requires-python = ">=3.12"
dependencies = [
    # Agent framework
    "pydantic-ai>=0.0.55",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",

    # Orchestration
    "temporalio>=1.8",

    # API
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",

    # LLM client (Bifrost is OpenAI-compatible)
    "openai>=1.50",

    # Observability — Langfuse + OpenTelemetry
    "langfuse>=2.50",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",

    # Storage
    "asyncpg>=0.29",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "pgvector>=0.3",
    "redis>=5.0",
    "clickhouse-connect>=0.8",
    "minio>=7.2",

    # Logging
    "structlog>=24.4",
]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["apps", "packages"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF", "ASYNC", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
mypy_path = "."

[[tool.mypy.overrides]]
module = ["temporalio.*", "clickhouse_connect.*", "minio.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra --strict-markers"
