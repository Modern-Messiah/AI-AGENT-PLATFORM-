name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Run backend tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: uv run pytest -q

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/ui
        run: npm ci

      - name: Run frontend tests
        working-directory: apps/ui
        run: |
          npm test
          npm run test:render

      - name: Build frontend
        working-directory: apps/ui
        run: npm run build

  lint:
    name: Lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Ruff (blocking)
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Mypy packages+apps (blocking)
        run: uv run mypy packages apps

  retrieval-evals:
    name: Retrieval quality evals
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: ci-eval-password
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:ci-eval-password@localhost:5432/app
      APP_DB_USER: aap_app
      APP_DB_PASSWORD: ci-eval-app-password
      FASTEMBED_CACHE_PATH: /home/runner/.cache/fastembed

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Install Python dependencies
        run: uv sync --frozen

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: /home/runner/.cache/fastembed
          key: fastembed-${{ hashFiles('pyproject.toml') }}

      - name: Run migrations
        run: |
          docker exec $(docker ps -qf "ancestor=pgvector/pgvector:pg16") psql -U postgres -d app -c "CREATE EXTENSION IF NOT EXISTS pg_trgm"
          uv run alembic upgrade head

      - name: Seed eval corpus
        run: PYTHONPATH=. uv run python scripts/seed_eval_corpus.py

      - name: Run retrieval eval (recall@5 >= 90%)
        run: |
          PYTHONPATH=. uv run python -m evals.runners.retrieval_eval \
            --tenant ci-eval --k 5 \
            --dataset evals/datasets/ci_retrieval.jsonl \
            --min-recall 0.9

  compose:
    name: Docker Compose config
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      HOST_BIND_ADDRESS: 127.0.0.1
      POSTGRES_PASSWORD: ci-postgres-password
      APP_DB_PASSWORD: ci-app-password
      CLICKHOUSE_PASSWORD: ci-clickhouse-password
      MINIO_ROOT_USER: aap_minio
      MINIO_ROOT_PASSWORD: ci-minio-password
      LANGFUSE_NEXTAUTH_SECRET: ci-nextauth-secret
      LANGFUSE_SALT: ci-langfuse-salt
      LANGFUSE_ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ADMIN_SECRET: ci-admin-secret
      MOONSHOT_API_KEY: ""
      DEEPSEEK_API_KEY: ""
      VITE_API_BASE_URL: /api
      VITE_API_KEY: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Docker Compose config
        run: docker compose config --quiet
